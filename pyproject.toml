[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jev-scientific-reviewer"
version = "0.1.0"
description = "Telegram-first scientific paper and proposal reviewer using JEV structured decisions plus optional reasoning LLMs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "python-telegram-bot>=21.6,<23",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<1"]

[project.scripts]
jev-reviewer = "jev_reviewer.bot:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_reviewer"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
